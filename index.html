<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Recommendation Website</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Optional CSS file -->
  </head>
  <body>
    <header id="header">
      <div class="logo-container">
        <img src="logo.png" alt="Logo" class="logo" />
      </div>
      <!-- Navigation Bar -->
      <div>
        <nav>
          <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact Us</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <!-- Home Section -->
    <section id="home">
      <h1>Welcome to the Travel Recommendation Website</h1>
      <div>
        <input
          id="searchInput"
          type="text"
          placeholder="Search for beaches, temples, or cities"
        />
        <button id="searchBtn">Search</button>
      </div>
      <div id="recommendations"></div>
    </section>

    <!-- About Section -->
    <section id="about">
      <h2>About Us</h2>
      <p>Our mission is to help you find your next dream destination!</p>
      <div id="aboutContent">
        <!-- Dynamic content populated by JS -->
      </div>
    </section>

    <!-- Contact Us Section -->
    <section id="contact">
      <h2>Contact Us</h2>
      <div class="contact-form">
        <p>If you have any questions, feel free to reach out!</p>
        <p>We would love to hear from you!</p>

        <form id="contactForm">
          <div>
            <label for="name">Name:</label>
            <input type="text" id="name" required />
          </div>
          <div>
            <label for="email">Email:</label>
            <input type="email" id="email" required />
          </div>
          <div>
            <label for="message">Message:</label>
            <textarea id="message" required></textarea>
          </div>
          <button type="submit">Send</button>
        </form>
      </div>
    </section>

    <!-- Link to JavaScript file -->
    <script src="project.js"></script>
  </body>
</html>
